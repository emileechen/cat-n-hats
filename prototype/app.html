<script>
const D = /*__DATA__*/null;
const KEY = "cnh-slice-v1";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAMES = ["Mochi", "Biscuit", "Pebble", "Juniper", "Olive", "Tofu", "Pumpkin", "Miso", "Clementine", "Waffles", "Beans", "Pudding", "Sesame", "Figaro", "Marble", "Dumpling", "Pickles", "Basil"];

const store = {
  load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v === Game.SAVE_VERSION ? s : null; } catch { return null; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
  clear() { try { localStorage.removeItem(KEY); } catch {} },
};
const specialFor = (coat) => D.specialByCoat[coat];
let state = store.load();
if (state) state = Game.normalize(state, specialFor);
const ui = { screen: "cats", box: "animals", viewCat: null, pickCoat: null, name: "", resetArmed: false, sellArmed: false };

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const article = (w) => /^(uni|use|eu)/i.test(w) ? "a" : /^[aeiou]/i.test(w) ? "an" : "a";
const hatName = (id) => D.hats[id].display;
const activeCat = () => state.cats.find((c) => c.id === state.activeCat) || state.cats[0];

function toast(msg) {

  root.replaceChildren(h("div", { class: "toast fade-in", role: "status" }, msg));
  clearTimeout(toast.t);
  toast.t = setTimeout(() => root.replaceChildren(), 2800);

/* ---------- pixel box (placeholder art, drawn in code) ---------- */
function drawBox(lidCanvas, bodyCanvas) {
  const C = { o: "#3a2f28", lid: "#e6c48f", box: "#d4a96c", shade: "#b5864d", rib: "#8e8bb0", ribS: "#6c6a9a", q: "#fff6e6" };
  const paint = (cv, w, hgt, fn) => { cv.width = w; cv.height = hgt; const x = cv.getContext("2d"); fn((c, X, Y, W = 1, H = 1) => { x.fillStyle = c; x.fillRect(X, Y, W, H); }); };
  paint(lidCanvas, 26, 10, (r) => {
    r(C.o, 7, 0, 4, 1); r(C.o, 15, 0, 4, 1); r(C.o, 6, 1, 1, 3); r(C.o, 11, 1, 1, 3); r(C.o, 14, 1, 1, 3); r(C.o, 19, 1, 1, 3);
    r(C.rib, 7, 1, 4, 3); r(C.rib, 15, 1, 4, 3); r(C.ribS, 9, 2, 2, 2); r(C.ribS, 15, 2, 2, 2); r(C.o, 12, 2, 2, 3); r(C.ribS, 12, 3, 2, 2);
    r(C.o, 1, 5, 24, 1); r(C.o, 1, 9, 24, 1); r(C.o, 1, 5, 1, 5); r(C.o, 24, 5, 1, 5);
    r(C.lid, 2, 6, 22, 3); r(C.shade, 2, 8, 22, 1); r(C.rib, 12, 6, 2, 3);
  });
  paint(bodyCanvas, 26, 14, (r) => {
    r(C.o, 2, 0, 1, 14); r(C.o, 23, 0, 1, 14); r(C.o, 2, 13, 22, 1);
    r(C.box, 3, 0, 20, 13); r(C.shade, 3, 11, 20, 2); r(C.shade, 21, 0, 2, 13); r(C.rib, 12, 0, 2, 13); r(C.ribS, 13, 0, 1, 13);
    const q = (X) => { r(C.q, X, 3, 3, 1); r(C.q, X + 2, 4, 1, 1); r(C.q, X + 1, 5, 2, 1); r(C.q, X + 1, 7, 1, 1); };
    q(6); q(16);
  });
}
function boxEl(extra = "") {
  const lid = h("canvas", { class: "lid", "aria-hidden": "true" }), body = h("canvas", { class: "body", "aria-hidden": "true" });
  drawBox(lid, body);
  return h("div", { class: `box ${extra}`, role: "img", "aria-label": "Mystery Hat Box" }, lid, body);
}

    hat ? h("img", { src: D.hats[hat].layer, alt: "", class: `px ${extraHatClass}` }) : null);

const allHatIds = () => [...new Set([...Object.values(Game.SETS).flatMap((set) => set.pool), ...Game.MILESTONES.map((m) => m.hat).filter(Boolean), ...state.cats.map((c) => c.special)])];
const NOUN = { animals: "hoods", basic: "hats" };
const rewardText = (m) => m.hat ? `${hatName(m.hat)} + ${m.shards} 💎` : `${m.shards} 💎`;

function catCard(cat, { z = 4, hat = cat.hat, hatClass = "" } = {}) {
  return h("div", { class: "catcard" },
    h("div", { class: "plate" }, h("span", { class: "plate-name" }, cat.name.toUpperCase())),
    h("div", { class: "frame" }, sprite(cat.coat, hat, z, hatClass)));
}
function progressBar(boxId) {
  const box = Game.SETS[boxId], have = Game.uniquePoolHats(state, boxId), total = box.pool.length;
  return h("div", { class: "progress" },
    h("div", { class: "bar", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": total, "aria-valuenow": have, "aria-label": `${box.name} collected` },
      h("div", { class: "fill", style: `width:${(have / total) * 100}%` }),
      Game.MILESTONES.filter((m) => m.box === boxId).map((m) => h("div", { class: `mark ${state.claimed.includes(m.id) ? "" : "locked"}`, style: `left:${(m.threshold / total) * 100}%`, title: `${m.threshold}: ${rewardText(m)}` },
        String(m.threshold)))),
    h("div", { class: "bar-legend small" }, h("span", {}, h("b", {}, `${have}`), ` of ${total} ${box.name}`), h("span", { class: "muted" }, nextMilestoneText(boxId, have))));
}
function nextMilestoneText(boxId, have) {
  const set = Game.SETS[boxId];
  if (!Game.MILESTONES.some((x) => x.box === boxId)) return set.source === "shop" ? "Sold in the shop" : "";
  const m = Game.MILESTONES.find((x) => x.box === boxId && !state.claimed.includes(x.id));
  return m ? `${m.threshold - have} more for ${m.hat ? D.hats[m.hat].short : `${m.shards} 💎`}` : "Set complete!";
}
function msUntilMidnight() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); return m - n; }
function fmtCountdown(ms) { const m = Math.ceil(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; }

function floatHearts(el) {

  const r = el.getBoundingClientRect();
  const fx = h("div", { class: "fx", "aria-hidden": "true" });
  for (let i = 0; i < 4; i++) fx.append(h("span", { class: "heartpop", style: `left:${r.left + r.width * (0.3 + Math.random() * 0.4)}px;top:${r.top + r.height * 0.35}px;animation-delay:${i * 90}ms` }, "♥"));
  document.body.append(fx);
  setTimeout(() => fx.remove(), 1400);
}

  const cat = state.cats.find((c) => c.id === catId);

  commit(next);

function dayLabel(day) {
  if (day === Game.dayKey(Date.now(), state.dayOffset)) return "Today";
  if (day === Game.dayKey(Date.now(), state.dayOffset - 1)) return "Yesterday";
  const [y, m, d] = day.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

    dups.length
      ? [h("ol", { class: "history" }, dups.map((id) => h("li", { class: "hrow" },
          h("div", { class: "hicon" }, h("div", { class: "fig" }, h("img", { src: D.hats[id].layer, alt: "", class: "px" }))),
          h("div", { style: "display:grid;gap:2px;min-width:0" }, h("b", {}, hatName(id)), h("span", { class: "small muted" }, `${state.hats[id] - 1} spare`)),
          h("button", { class: "btn small", type: "button", onclick: () => sell(id) }, `Sell +${(state.hats[id] - 1) * Game.SHOP.sellPrice} 💎`)))),
        h("button", { class: "btn", type: "button", onclick: (e) => sellAll(e.currentTarget, spares) }, `Sell all ${spares} spare${spares === 1 ? "" : "s"} for ${spares * Game.SHOP.sellPrice} 💎`)]
      : h("p", { class: "small" }, "No spares right now. Duplicates from your boxes show up here.")));
  view.append(h("p", { class: "devnote" }, "Shop-only hat sets can be added here later. Box hats are never for sale."));
}

function openAdoptSheet(coat) {
  const c = D.coats[coat], price = Game.SHOP.cats[coat], afford = state.shards >= price;
  let name = "";
  const preview = { name: "…", coat, hat: null };
  const card = catCard(preview, { z: 3 });
  const adoptBtn = h("button", { class: "btn primary", type: "button", disabled: true, onclick: () => adoptSpecial(coat, name) }, `Adopt for ${price} 💎`);
  const input = h("input", { id: "adopt-name", maxlength: "20", autocomplete: "off", placeholder: "Name them", disabled: !afford,
    oninput: (e) => { name = e.target.value; $(".plate-name", card).textContent = (name || "…").toUpperCase(); adoptBtn.disabled = !afford || !name.trim(); },
    onkeydown: (e) => { if (e.key === "Enter" && afford && name.trim()) adoptSpecial(coat, name); } });
  const close = overlay(h("div", { class: "sheet", style: "text-align:center;justify-items:center" },
    card,
    h("h2", {}, c.name),
    h("p", { class: "muted" }, c.desc),
    h("p", { class: "small" }, afford ? `${price} 💎 · you have ${state.shards} 💎` : `${price} 💎 · you need ${price - state.shards} more`),
    h("label", { class: "field", for: "adopt-name", style: "width:100%;text-align:left" }, h("span", { class: "tag" }, "NAME"), input),
    h("div", { class: "row", style: "justify-content:center" },
      h("button", { class: "btn small", type: "button", disabled: !afford, onclick: () => {
        name = pick(NAMES.filter((n) => !state.cats.some((x) => x.name === n))); input.value = name; input.dispatchEvent(new Event("input"));
      } }, "Suggest a name"),
      adoptBtn, h("button", { class: "btn", type: "button", onclick: () => close() }, "Not now"))));
  openAdoptSheet.close = close;
  if (afford) setTimeout(() => input.focus(), 0);
}

function adoptSpecial(coat, name) {
  name = name.trim();
  if (!name) return;
  openAdoptSheet.close?.();
  const { state: next, cat } = Game.adoptFromShop(state, { coat, name, line: pick(D.lines), special: specialFor(coat) }, Date.now());
  commit({ ...next, activeCat: cat.id }, { rerender: false });
  ui.viewCat = cat.id;
  go("cats");
  toast(`Welcome home, ${cat.name}!`);
}

function openBuySheet(id) {
  const cat = activeCat(), price = Game.SHOP.prices[id], afford = state.shards >= price;
  const close = overlay(h("div", { class: "sheet", style: "text-align:center;justify-items:center" },
    catCard(cat, { z: 3, hat: id }),
    h("h2", {}, hatName(id)),
    D.hats[id].desc ? h("p", { class: "muted" }, D.hats[id].desc) : null,
    h("p", { class: "small" }, afford ? `${price} 💎 · you have ${state.shards} 💎` : `${price} 💎 · you need ${price - state.shards} more`),
    h("div", { class: "row", style: "justify-content:center" },
      h("button", { class: "btn primary", type: "button", disabled: !afford, onclick: () => { close(); buy(id); } }, `Buy for ${price} 💎`),
      h("button", { class: "btn", type: "button", onclick: () => close() }, "Not now"))));
}

function buy(id) {
  const cat = activeCat();
  const { state: next, result } = Game.buyHat(state, id);
  commit(next);
  if (!result.milestones.length) { toast(`You bought the ${hatName(id)}.`); return; }
  const close = overlay(h("div", { class: "sheet", style: "text-align:center;justify-items:center" },
    h("p", { class: "tag" }, `YOU BOUGHT THE ${hatName(id).toUpperCase()}`),
    result.milestones.map((m) => milestoneCard(cat, m, (hat) => { close(); commit(Game.markSeen(Game.wear(state, cat.id, hat), hat)); toast(`${cat.name} is wearing the ${hatName(hat)}.`); })),
    h("button", { class: "btn", type: "button", onclick: () => close() }, "Done")));
}

function sell(id) {
  const { state: next, result } = Game.sellDuplicates(state, id);
  commit(next);
  toast(`Sold ${result.sold} ${hatName(id)} for ${result.shards} 💎.`);
}

function sellAll(btn, spares) {
  if (!ui.sellArmed) { ui.sellArmed = true; btn.textContent = `Tap again to sell all ${spares}`; return; }
  ui.sellArmed = false;
  const { state: next, result } = Game.sellDuplicates(state);
  commit(next);
  toast(`Sold ${result.sold} spare${result.sold === 1 ? "" : "s"} for ${result.shards} 💎.`);
}

function openDressSheet(catId) {
  const sheet = h("div", { class: "sheet" });
  const choose = (id) => { commit(Game.wear(state, catId, id)); draw(); };
  const draw = () => {
    const cat = state.cats.find((c) => c.id === catId);
    const owned = allHatIds().filter((id) => state.hats[id]);
    sheet.replaceChildren(
      h("div", { class: "row", style: "justify-content:space-between" }, h("h2", {}, `Dress up ${cat.name}`),
        h("button", { class: "btn small", type: "button", onclick: () => close() }, "Done")),
      catCard(cat, { z: 3 }),
      owned.length
        ? h("div", { class: "wardrobe" },
            h("button", { class: "mslot", type: "button", "aria-pressed": String(!cat.hat), onclick: () => choose(null) },
              h("div", { class: "fig" }), h("span", { class: "label" }, "No hat")),
            owned.map((id) => h("button", { class: "mslot", type: "button", "aria-pressed": String(cat.hat === id), onclick: () => choose(id) },
              h("div", { class: "fig" }, h("img", { src: D.hats[id].layer, alt: "", class: "px" })), h("span", { class: "label" }, hatName(id)))))
        : h("p", { class: "muted" }, "No hats yet. Open today's Mystery Hat Box to find the first one."),
      h("p", { class: "small muted", style: "text-align:center" }, `${owned.length} hats found. Hats are shared by all your cats.`));
  };
  const close = overlay(sheet);
  draw();
}

function openRename(catId) {
  const cat = state.cats.find((c) => c.id === catId);
  const input = h("input", { id: "rename-input", value: cat.name, maxlength: "20", autocomplete: "off" });
  const close = overlay(h("form", { class: "sheet", onsubmit: (e) => { e.preventDefault(); close(); commit(Game.renameCat(state, catId, input.value)); } },
    h("h2", {}, `Rename ${cat.name}`),
    h("label", { class: "field", for: "rename-input" }, h("span", { class: "tag" }, "NAME"), input),
    h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, "Save"),
      h("button", { class: "link", type: "button", onclick: () => close() }, "Cancel"))));
  setTimeout(() => input.select(), 0);
}

/* ---------- overlays ---------- */
function overlay(content, { onClose, dismissable = true } = {}) {
  const root = $("#overlay-root");
  $("#toast-root").replaceChildren();
  const onKey = (e) => { if (e.key === "Escape" && dismissable) close(); };
  const close = () => { document.removeEventListener("keydown", onKey); root.replaceChildren(); onClose?.(); };
  const el = h("div", { class: "overlay", onclick: (e) => { if (dismissable && e.target === el) close(); } }, content);
  root.replaceChildren(el);
  document.addEventListener("keydown", onKey);
  return close;
}

function milestoneCard(cat, m, onWear) {
  return h("div", { class: "milestone fade-in" }, h("h2", {}, `${m.label}!`),
    h("p", { class: "small" }, `You've found ${m.threshold} ${Game.SETS[m.box].name}. Here's ${m.hat ? `${article(hatName(m.hat))} ${hatName(m.hat)} and ` : ""}${m.shards} 💎.`),
    m.hat ? sprite(cat.coat, m.hat, 2.5) : null,
    m.hat ? h("button", { class: "btn small", type: "button", onclick: (e) => { e.stopPropagation(); onWear(m.hat); } }, `Wear the ${hatName(m.hat)}`) : null);
}

async function startReveal(boxId) {
  const cat = activeCat();
  const boxInfo = Game.BOXES[boxId];
  const { state: next, result } = Game.openBox(state, Date.now(), Math.random, { box: boxId, cat: cat.id });
  commit(next, { rerender: false });
  const hat = result.hat, name = hatName(hat);
  let skip = false;
  const wait = (ms) => skip ? Promise.resolve() : sleep(ms);
  const box = boxEl("big-box");
  const line = h("p", { class: "line" });
  const stage = h("div", { class: "stage" }, box);
  const sheet = h("div", { class: "sheet reveal", onclick: () => { skip = true; } }, h("p", { class: "tag" }, `${boxInfo.name.toUpperCase()} BOX`), stage, line);
  const close = overlay(sheet, { dismissable: false });

  box.classList.add("shake"); await wait(900);
  box.classList.add("pop"); await wait(450);
  line.textContent = `${cat.name} reaches into the box and pulls out`;
  for (let i = 0; i < 9 && !skip; i++) { line.textContent += "."; await wait(90); }
  if (skip) line.textContent = `${cat.name} reaches into the box and pulls out.........`;
  line.textContent += ` ${article(name)} ${name}!`;
  await wait(250);

  stage.replaceChildren(catCard({ ...cat }, { z: 3, hat, hatClass: REDUCED ? "" : "drop" }));
  const badges = h("div", { class: "badges fade-in" },
    result.isNew ? h("span", { class: "badge new" }, "NEW!") : h("span", { class: "badge" }, `YOU HAVE ${result.count}`),
    result.shards ? h("span", { class: "badge" }, `+${result.shards} 💎`) : null,
    h("span", { class: "badge" }, `${Game.uniquePoolHats(state, boxId)} / ${boxInfo.pool.length} FOUND`),
    result.friendship.gained ? h("span", { class: "badge heart" }, `+${result.friendship.gained} ♥ ${cat.name.toUpperCase()}`) : null);
  const desc = D.hats[hat].desc ? h("p", { class: "small muted fade-in" }, D.hats[hat].desc) : null;
  sheet.append(badges);
  if (desc) sheet.append(desc);
  const finish = (wearHat) => {
    close();
    if (wearHat) {
      let s = Game.wear(state, cat.id, wearHat);
      s = Game.markSeen(s, wearHat);
      commit(s);
      toast(`${cat.name} is wearing the ${hatName(wearHat)}.`);
    } else render();
  };
  for (const m of result.milestones) {
    await wait(500);
    sheet.append(milestoneCard(cat, m, finish));
  }
  if (result.friendship.unlocked) { await wait(500); sheet.append(specialCard(cat, result.friendship.unlocked, finish)); }
  sheet.append(h("div", { class: "row fade-in", style: "justify-content:center" },
    h("button", { class: "btn primary", type: "button", onclick: (e) => { e.stopPropagation(); finish(hat); } }, "Wear it now"),
    h("button", { class: "btn", type: "button", onclick: (e) => { e.stopPropagation(); finish(null); } }, "Not now")));
}

function openHatSheet(id) {
  const n = state.hats[id] || 0, cat = activeCat(), hat = D.hats[id];
  const reward = Game.MILESTONES.find((m) => m.hat === id);
  const owner = state.cats.find((c) => c.special === id);
  if (n && state.unseen.includes(id)) commit(Game.markSeen(state, id));
  const close = overlay(h("div", { class: "sheet" },
    n ? catCard(cat, { z: 3, hat: id }) : h("div", { class: "mslot missing", style: "cursor:default;justify-self:center;width:180px" }, h("div", { class: "fig" }, h("img", { src: hat.layer, alt: "", class: "px" }))),
    h("div", { style: "display:grid;gap:4px" },
      h("h2", {}, n ? hat.display : "Not found yet"),
      n ? h("span", { class: "tag" }, `${hat.id} · ${hat.name.toUpperCase()}`) : null,
      n && hat.desc ? h("p", { class: "muted" }, hat.desc) : null,
      h("p", { class: "small" }, n ? `You have ${n}.` : reward ? `Reward for collecting ${reward.threshold} ${Game.BOXES[reward.box].name}.`
        : owner ? `${owner.name}'s special hat. Unlocks at ${Game.FRIENDSHIP.hearts} hearts.`
        : Game.SHOP.prices[id] ? `Sold in the shop for ${Game.SHOP.prices[id]} 💎.` : "Keep opening boxes. It's in there somewhere.")),
    h("div", { class: "row" },
      n && cat.hat !== id ? h("button", { class: "btn primary", type: "button", onclick: () => { close(); commit(Game.wear(state, cat.id, id)); toast(`${cat.name} is wearing the ${hat.display}.`); } }, `Wear on ${cat.name}`) : null,
      n && cat.hat === id ? h("span", { class: "tag" }, `${cat.name.toUpperCase()} IS WEARING THIS`) : null,
      h("button", { class: "btn", type: "button", onclick: () => close() }, "Close"))));
}

function openTools() {
  const owned = new Set(state.cats.map((c) => c.coat));
  const close = overlay(h("div", { class: "sheet" },
    h("h2", {}, "Prototype tools"),
    h("p", { class: "small muted" }, `Simulated days ahead: ${state.dayOffset}. These exist only to test the slice.`),
    h("div", { style: "display:grid;gap:10px" },
      h("button", { class: "btn", type: "button", onclick: () => { close(); commit(Game.skipDay(state)); toast("It's tomorrow. A new box is here."); } }, "Skip to tomorrow"),
      h("button", { class: "btn", type: "button", onclick: () => { close(); fastForward(7); } }, "Open the next 7 days of boxes"),
      h("button", { class: "btn", type: "button", onclick: () => {
        close();
        const cat = activeCat(), { state: next, result } = Game.addFriendship(state, cat.id, 10);
        commit(next);
        if (result.unlocked) openSpecialSheet(cat.id, result.unlocked); else toast(`+10 friendship with ${cat.name}`);
      } }, `+10 friendship with ${activeCat().name}`),
      h("button", { class: "btn", type: "button", onclick: () => {
        const coats = Object.keys(D.coats).filter((k) => !owned.has(k) && !Game.SHOP.cats[k]);
        if (!coats.length) { toast("Every coat already lives here."); return; }
        const coat = pick(coats), name = pick(NAMES.filter((n) => !state.cats.some((c) => c.name === n)));
        close();
        commit(Game.adoptCat(state, { coat, name, line: pick(D.lines), special: specialFor(coat) }, Date.now()).state);
        toast(`${name}, a ${D.coats[coat].name.toLowerCase()} cat, wandered in!`);
      } }, "A new cat arrives"),
      h("button", { class: "btn", type: "button", onclick: (e) => {
        if (!ui.resetArmed) { ui.resetArmed = true; e.target.textContent = "Tap again to erase everything"; return; }
        ui.resetArmed = false; close(); store.clear(); state = null; ui.screen = "cats"; render();
      } }, "Start over"),
      h("button", { class: "link", type: "button", onclick: () => { ui.resetArmed = false; close(); } }, "Close"))), { onClose: () => { ui.resetArmed = false; } });
}

function fastForward(days) {
  let s = state, newHats = 0, shards = 0, ms = [];
  for (let i = 0; i < days; i++) {
    if (!Game.canOpen(s, Date.now())) s = Game.skipDay(s);
    const out = Game.openBox(s, Date.now());
    s = out.state; newHats += out.result.isNew ? 1 : 0; shards += out.result.shards; ms.push(...out.result.milestones);
  }
  commit(s);
  toast(`${days} boxes: ${newHats} new hood${newHats === 1 ? "" : "s"}, +${shards} 💎${ms.length ? ` · ${ms.map((m) => m.label).join(", ")}!` : ""}`);
}

/* ---------- shell ---------- */
function go(screen) { ui.screen = screen; render(); window.scrollTo(0, 0); }

function render() {
  const view = $("#view");
  view.replaceChildren();
  const onboard = !state;
  $("#tabs").hidden = onboard; $("#shards").hidden = onboard; $("#tools-btn").hidden = onboard; $("#featured").hidden = onboard;
  if (onboard) { renderOnboarding(view); return; }
  $("#shards").textContent = `${state.shards} 💎`;
  $("#featured").replaceChildren(h("span", { class: "star", "aria-hidden": "true" }, "★ "), activeCat().name);
  $("#featured").setAttribute("aria-label", `Featured cat: ${activeCat().name}`);
  const tabs = [["cats", "Cats", "♥"], ["box", "Box", "?"], ["collection", "Collection", "▤"], ["shop", "Shop", "◆"]];
  $("#tabs-inner").replaceChildren(...tabs.map(([k, label, glyph]) => h("button", { class: "tab", type: "button", "aria-current": ui.screen === k ? "page" : null, onclick: () => go(k) },
    h("span", { class: "glyph", "aria-hidden": "true" }, glyph), label,
    k === "cats" && !Game.pettedToday(state, activeCat(), Date.now()) ? h("span", { class: "dot", "aria-label": "Wants pets" }) : null,
    k === "box" && Game.canOpen(state, Date.now()) ? h("span", { class: "dot", "aria-label": "Box ready" }) : null,
    k === "collection" && state.unseen.length ? h("span", { class: "dot", "aria-label": "New hats" }) : null)));
  ui.sellArmed = false;
  ({ cats: renderCats, box: renderBox, collection: renderCollection, shop: renderShop })[ui.screen](view);
}

document.documentElement.style.setProperty("--mannequin", `url("${D.mannequin}")`);
$("#tools-btn").addEventListener("click", openTools);
$("#featured").addEventListener("click", () => { ui.viewCat = state.activeCat; go("cats"); });
setInterval(() => {
  if (!state || ui.screen !== "box") return;
  if (Game.canOpen(state, Date.now())) { if (!$(".boxcard")) render(); }
  else { const el = $("#countdown"); if (el) el.textContent = `Today's box is open. Next box in ${fmtCountdown(msUntilMidnight())}.`; }
}, 30000);
if (state && Game.canOpen(state, Date.now())) ui.screen = "box";
render();
</script>
